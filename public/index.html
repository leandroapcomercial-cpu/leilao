<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leilão Fácil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
  .container { max-width: 720px; margin: 0 auto; padding: 20px; }
  .header { text-align: center; padding: 32px 0 16px; }
  .header h1 { font-size: 32px; color: #dc2626; margin-bottom: 8px; }
  .header p { color: #64748b; font-size: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
  .premio-img { width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; }
  .premio-nome { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
  .premio-desc { color: #64748b; font-size: 15px; line-height: 1.5; }
  .timer-box { text-align: center; padding: 20px; background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); color: #fff; border-radius: 12px; margin-bottom: 20px; }
  .timer-box .label { font-size: 13px; text-transform: uppercase; opacity: 0.9; letter-spacing: 1px; }
  .timer-box .time { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 8px 0; }
  .meta-box { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-top: 1px solid #e2e8f0; margin-top: 16px; }
  .meta-item { text-align: center; }
  .meta-item .num { font-size: 24px; font-weight: 700; color: #2563eb; }
  .meta-item .lbl { font-size: 12px; color: #64748b; text-transform: uppercase; }
  .btn-lance { display: block; width: 100%; padding: 18px; font-size: 18px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); border: none; border-radius: 12px; cursor: pointer; transition: transform .1s, box-shadow .2s; }
  .btn-lance:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(22,163,74,0.3); }
  .btn-lance:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
  .ranking { margin-top: 8px; }
  .ranking h3 { font-size: 16px; margin-bottom: 12px; color: #334155; }
  .rank-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; margin-bottom: 8px; background: #f1f5f9; }
  .rank-item.gold { background: linear-gradient(90deg, #fef3c7 0%, #fde68a 100%); }
  .rank-item.silver { background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 100%); }
  .rank-item.bronze { background: linear-gradient(90deg, #fff7ed 0%, #fed7aa 100%); }
  .rank-pos { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; font-size: 14px; background: #fff; color: #475569; }
  .rank-name { flex: 1; font-weight: 600; font-size: 14px; }
  .rank-val { font-weight: 700; color: #dc2626; font-size: 16px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
  .modal-overlay.active { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 420px; padding: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
  .modal h3 { margin-bottom: 16px; font-size: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #475569; }
  .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
  .form-group input:focus { outline: none; border-color: #2563eb; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-success { background: #16a34a; color: #fff; }
  .pix-box { background: #f0fdf4; border: 2px dashed #86efac; border-radius: 12px; padding: 20px; text-align: center; margin: 16px 0; }
  .pix-box code { font-size: 13px; word-break: break-all; color: #166534; }
  .close-btn { position: absolute; top: 16px; right: 16px; background: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #fff; padding: 14px 24px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 2000; transition: transform .3s; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
  .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #dc2626; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔨 Leilão Fácil</h1>
    <p id="campSubtitulo">Carregando...</p>
  </div>

  <div id="content">
    <div class="empty-state"><div class="spinner"></div><p>Carregando campanha...</p></div>
  </div>
</div>

<!-- Modal Login -->
<div class="modal-overlay" id="modalLogin">
  <div class="modal">
    <h3>👋 Bem-vindo!</h3>
    <p style="color:#64748b; margin-bottom:16px; font-size:14px;">Informe seus dados para participar do leilão.</p>
    <div class="form-group"><label>Seu nome</label><input type="text" id="userNome" placeholder="João Silva"></div>
    <div class="form-group"><label>Seu email</label><input type="email" id="userEmail" placeholder="joao@email.com"></div>
    <button class="btn btn-primary" onclick="entrarLeilao()">Entrar no Leilão</button>
  </div>
</div>

<!-- Modal PIX -->
<div class="modal-overlay" id="modalPix">
  <div class="modal" style="position:relative;">
    <button class="close-btn" onclick="closePix()">✕</button>
    <h3>💳 Confirmar Lance</h3>
    <p style="color:#64748b; margin-bottom:12px; font-size:14px;">Você está dando um lance de <strong id="pixValor">R$ 0,00</strong>.</p>
    <div class="pix-box">
      <p style="font-size:12px; color:#166534; margin-bottom:8px;">Escaneie o QR Code ou copie o código PIX:</p>
      <code id="pixCode">00020126580014br.gov.bcb.pix0136...</code>
    </div>
    <button class="btn btn-success" onclick="confirmarPagamento()">✅ Já paguei (Confirmar)</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API = '';
const socket = io();
let campanha = null;
let usuario = null;
let lances = [];
let timerInterval = null;

const slug = window.location.pathname.replace(/^\//, '').split('?')[0] || '';

async function init() {
  if (!slug) { showContent('<div class="empty-state">Nenhuma campanha encontrada.</div>'); return; }
  try {
    const res = await fetch(`${API}/api/campanha/${slug}`);
    if (!res.ok) throw new Error('Campanha não encontrada');
    campanha = await res.json();
    document.title = campanha.nome + ' | Leilão Fácil';
    document.getElementById('campSubtitulo').textContent = campanha.descricao || 'Participe e concorra!';
    renderCampanha();
    loadLances();
    checkUser();
  } catch (err) { showContent('<div class="empty-state"><h3>😕 Campanha não encontrada</h3><p>'+err.message+'</p></div>'); }
}

function showContent(html) { document.getElementById('content').innerHTML = html; }

function renderCampanha() {
  const c = campanha;
  const imgHtml = c.premio_imagem ? `<img src="${c.premio_imagem}" class="premio-img" alt="Prêmio" onerror="this.style.display='none'">` : '';
  const meta = parseFloat(c.meta_valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
  const arrec = parseFloat(c.arrecadado||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
  const vlance = parseFloat(c.valor_lance||0.01).toLocaleString('pt-BR',{minimumFractionDigits:2});
  const ativa = c.status === 'ativa';
  const encerrada = c.status === 'finalizada' || (c.data_fim && new Date(c.data_fim) < new Date());

  let btnHtml = '';
  if (encerrada) btnHtml = '<button class="btn-lance" disabled>🏁 Leilão Encerrado</button>';
  else if (!ativa) btnHtml = '<button class="btn-lance" disabled>⏳ Leilão não iniciado</button>';
  else btnHtml = `<button class="btn-lance" onclick="abrirPix()">🔥 Dar Lance (R$ ${vlance})</button>`;

  let timerHtml = '';
  if (ativa && !encerrada) {
    timerHtml = `<div class="timer-box"><div class="label">⏱️ Tempo restante</div><div class="time" id="timer">00:00:00</div></div>`;
  }

  showContent(`
    <div class="card">
      ${imgHtml}
      <div class="premio-nome">${c.premio_nome || c.nome}</div>
      <div class="premio-desc">${c.premio_descricao || c.descricao || ''}</div>
      <div class="meta-box">
        <div class="meta-item"><div class="num">R$ ${arrec}</div><div class="lbl">Arrecadado</div></div>
        <div class="meta-item"><div class="num">R$ ${meta}</div><div class="lbl">Meta</div></div>
        <div class="meta-item"><div class="num">${c.total_lances||0}</div><div class="lbl">Lances</div></div>
      </div>
    </div>
    ${timerHtml}
    ${btnHtml}
    <div class="card ranking">
      <h3>🏆 Ranking</h3>
      <div id="rankingList"><p style="color:#94a3b8; text-align:center; padding:20px;">Nenhum lance ainda. Seja o primeiro!</p></div>
    </div>
  `);

  if (ativa && c.data_fim) startTimer(new Date(c.data_fim));
}

function startTimer(endDate) {
  if (timerInterval) clearInterval(timerInterval);
  function update() {
    const diff = endDate - Date.now();
    const el = document.getElementById('timer');
    if (!el) { clearInterval(timerInterval); return; }
    if (diff <= 0) { el.textContent = '00:00:00'; clearInterval(timerInterval); location.reload(); return; }
    const h = String(Math.floor(diff/3600000)).padStart(2,'0');
    const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    el.textContent = `${h}:${m}:${s}`;
  }
  update();
  timerInterval = setInterval(update, 1000);
}

async function loadLances() {
  if (!campanha) return;
  try {
    const res = await fetch(`${API}/api/lances/${campanha.id}`);
    lances = await res.json();
    renderRanking();
  } catch (e) {}
}

function renderRanking() {
  const el = document.getElementById('rankingList');
  if (!el) return;
  if (!lances.length) { el.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:20px;">Nenhum lance ainda. Seja o primeiro!</p>'; return; }
  let html = '';
  lances.forEach((l, i) => {
    const cls = i===0 ? 'gold' : i===1 ? 'silver' : i===2 ? 'bronze' : '';
    const medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : `<span class="rank-pos">${i+1}</span>`;
    html += `<div class="rank-item ${cls}">${medal}<div class="rank-name">${l.nome_usuario||l.nome||'Anônimo'}</div><div class="rank-val">R$ ${parseFloat(l.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>`;
  });
  el.innerHTML = html;
}

function checkUser() {
  const u = localStorage.getItem('lf_user');
  if (u) { usuario = JSON.parse(u); return; }
  if (campanha && campanha.status === 'ativa') setTimeout(() => document.getElementById('modalLogin').classList.add('active'), 800);
}

async function entrarLeilao() {
  const nome = document.getElementById('userNome').value.trim();
  const email = document.getElementById('userEmail').value.trim();
  if (!nome || !email) { showToast('Preencha nome e email', 'error'); return; }
  try {
    const res = await fetch(`${API}/api/usuarios`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({nome, email}) });
    usuario = await res.json();
    localStorage.setItem('lf_user', JSON.stringify(usuario));
    document.getElementById('modalLogin').classList.remove('active');
    showToast('Bem-vindo, ' + nome + '!');
  } catch (e) { showToast('Erro ao entrar', 'error'); }
}

function abrirPix() {
  if (!usuario) { document.getElementById('modalLogin').classList.add('active'); return; }
  const valor = parseFloat(campanha.valor_lance||0.01).toLocaleString('pt-BR',{minimumFractionDigits:2});
  document.getElementById('pixValor').textContent = 'R$ ' + valor;
  document.getElementById('modalPix').classList.add('active');
}

function closePix() { document.getElementById('modalPix').classList.remove('active'); }

async function confirmarPagamento() {
  if (!usuario || !campanha) return;
  try {
    const res = await fetch(`${API}/api/lances`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ campanha_id: campanha.id, usuario_id: usuario.id, valor: campanha.valor_lance })
    });
    if (!res.ok) throw new Error('Erro ao registrar lance');
    closePix();
    showToast('✅ Lance confirmado!');
    loadLances();
  } catch (e) { showToast(e.message, 'error'); }
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type==='error' ? '#dc2626' : '#1e293b';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Socket.IO
socket.on('novo_lance', (data) => {
  if (campanha && data.campanha_id == campanha.id) {
    loadLances();
  }
});

init();
</script>
</body>
</html>
