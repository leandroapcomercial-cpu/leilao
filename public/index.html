<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leilão Fácil</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
  .container{max-width:480px;margin:0 auto;background:#f0f2f5;min-height:100vh}

  /* Header */
  .topbar{background:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100}
  .brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;color:#1a1a2e}
  .brand .bolt{color:#fbbf24;font-size:18px}
  .topbar-right{display:flex;align-items:center;gap:8px}
  .badge-live{background:linear-gradient(135deg,#ec4899,#db2777);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;display:flex;align-items:center;gap:4px}
  .badge-live::before{content:'';width:6px;height:6px;background:#fff;border-radius:50%;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .user-name{font-size:13px;color:#475569;font-weight:600}
  .btn-sair{background:#fff;border:1px solid #ef4444;color:#ef4444;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
  .btn-sair:hover{background:#fef2f2}

  /* Cards */
  .card{background:#fff;border-radius:16px;margin:12px 16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card-title{text-align:center;font-size:22px;font-weight:800;color:#1e3a8a;margin-bottom:6px}
  .card-subtitle{text-align:center;font-size:14px;color:#64748b;margin-bottom:16px;line-height:1.4}
  .prize-badge{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:#dc2626;margin-bottom:12px}
  .prize-img-wrap{position:relative;text-align:center;margin-bottom:16px}
  .prize-img{width:100%;max-width:280px;height:220px;object-fit:cover;border-radius:16px;display:inline-block;border:1px solid #e2e8f0}
  .zoom-btn{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;border:none;cursor:pointer;backdrop-filter:blur(4px)}
  .meta-text{text-align:center;font-size:16px;color:#64748b;margin-bottom:16px}
  .meta-text strong{color:#2563eb;font-size:20px}

  /* Vencedor */
  .winner-box{text-align:center;padding:16px;background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:12px;margin-bottom:16px}
  .winner-box .trophy{font-size:24px;margin-bottom:4px}
  .winner-box .label{font-size:11px;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:1px}
  .winner-box .name{font-size:18px;font-weight:800;color:#78350f;margin:4px 0}
  .winner-box .value{font-size:20px;font-weight:800;color:#dc2626}
  .winner-box .date{font-size:12px;color:#a16207;margin-top:4px}

  /* Timer */
  .timer-box{background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:16px;padding:20px;text-align:center;color:#fff;margin-bottom:16px}
  .timer-box .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;opacity:.9;margin-bottom:8px}
  .timer-box .time{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.2)}
  .timer-box .lance-atual{font-size:16px;font-weight:700;margin-top:10px}
  .timer-box .lance-atual span{color:#fbbf24;font-size:22px}

  /* Stats */
  .participants{text-align:center;font-size:14px;color:#64748b;margin-bottom:12px}
  .participants strong{color:#1e3a8a}

  /* Próximo lance */
  .proximo-lance{text-align:center;margin-bottom:16px}
  .proximo-lance .label{font-size:13px;color:#64748b;display:flex;align-items:center;justify-content:center;gap:6px}
  .proximo-lance .valor{font-size:28px;font-weight:800;color:#1e3a8a}

  /* Botão */
  .btn-lance{display:block;width:100%;padding:16px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:14px;cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(16,185,129,.3);margin-bottom:10px}
  .btn-lance:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(16,185,129,.4)}
  .btn-lance:disabled{background:#94a3b8;cursor:not-allowed;transform:none;box-shadow:none}
  .info-text{text-align:center;font-size:12px;color:#94a3b8;margin-bottom:16px}

  /* Últimos lances */
  .section-title{font-size:16px;font-weight:800;color:#1e3a8a;margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .lance-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f5f9}
  .lance-item:last-child{border-bottom:none}
  .lance-user{display:flex;align-items:center;gap:10px}
  .lance-avatar{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
  .lance-name{font-size:14px;font-weight:600;color:#1e293b}
  .lance-time{font-size:11px;color:#94a3b8}
  .lance-valor{font-size:16px;font-weight:800;color:#2563eb}

  /* Ver ranking */
  .btn-ranking{display:block;width:100%;padding:12px;text-align:center;background:#fff;border:2px solid #3b82f6;color:#3b82f6;font-size:14px;font-weight:700;border-radius:12px;cursor:pointer;margin-top:8px}
  .btn-ranking:hover{background:#eff6ff}

  /* Ranking card */
  .ranking-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
  .rank-tab{flex:1;padding:10px 8px;text-align:center;background:#f1f5f9;border:none;border-radius:10px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;white-space:nowrap}
  .rank-tab.active{background:#2563eb;color:#fff}
  .rank-item{display:flex;align-items:center;gap:12px;padding:14px;background:#f8fafc;border-radius:12px;margin-bottom:8px;border:1px solid #e2e8f0}
  .rank-item.gold{background:linear-gradient(90deg,#fef3c7,#fde68a);border-color:#fbbf24}
  .rank-item.silver{background:linear-gradient(90deg,#f1f5f9,#e2e8f0);border-color:#cbd5e1}
  .rank-item.bronze{background:linear-gradient(90deg,#fff7ed,#fed7aa);border-color:#fdba74}
  .rank-pos{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;font-size:13px;background:#e2e8f0;color:#475569}
  .rank-pos.gold{background:#fbbf24;color:#78350f}
  .rank-pos.silver{background:#cbd5e1;color:#334155}
  .rank-pos.bronze{background:#fdba74;color:#7c2d12}
  .rank-info{flex:1}
  .rank-name{font-weight:700;font-size:14px;color:#1e293b}
  .rank-detail{font-size:12px;color:#64748b}
  .rank-valor{font-weight:800;color:#dc2626;font-size:16px}

  /* Footer */
  .footer{text-align:center;padding:20px 16px 40px;color:#94a3b8;font-size:12px}

  /* Modals */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(4px)}
  .modal-overlay.active{display:flex}
  .modal{background:#fff;border-radius:20px;width:100%;max-width:400px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.3);position:relative}
  .modal h3{font-size:20px;margin-bottom:6px;color:#1e3a8a}
  .modal p.sub{color:#64748b;font-size:14px;margin-bottom:20px}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;margin-bottom:5px;font-size:13px;font-weight:600;color:#374151}
  .form-group input{width:100%;padding:14px 16px;border:1px solid #d1d5db;border-radius:12px;font-size:15px;background:#f9fafb}
  .form-group input:focus{outline:none;border-color:#3b82f6;background:#fff}
  .btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
  .btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
  .close-btn{position:absolute;top:14px;right:14px;background:#f1f5f9;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;color:#64748b}
  .pix-box{background:#f0fdf4;border:2px dashed #86efac;border-radius:14px;padding:20px;text-align:center;margin:16px 0}
  .pix-box .qr{width:160px;height:160px;background:#fff;border-radius:12px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#1e3a8a;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .pix-box code{font-size:12px;word-break:break-all;color:#166534;font-family:ui-monospace,SFMono-Regular,monospace}

  /* Toast */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1e293b;color:#fff;padding:14px 24px;border-radius:14px;font-weight:700;font-size:14px;z-index:2000;transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.error{background:#dc2626}

  /* Loading */
  .loading{text-align:center;padding:60px 20px}
  .spinner{width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Empty */
  .empty-state{text-align:center;padding:40px 20px;color:#94a3b8}
  .empty-state p{margin-top:8px}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="topbar" id="topbar" style="display:none">
    <div class="brand"><span class="bolt">⚡</span> Leilão Fácil</div>
    <div class="topbar-right">
      <span class="badge-live">AO VIVO</span>
      <span class="user-name" id="headerUserName"></span>
      <button class="btn-sair" onclick="sairLeilao()">✕ Sair</button>
    </div>
  </div>

  <!-- Loading -->
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p style="color:#64748b">Carregando leilão...</p>
    </div>
  </div>

  <div class="footer" id="footer" style="display:none">
    <p>Leilão Fácil • PIX integrado • Transparente</p>
  </div>
</div>

<!-- Modal Login -->
<div class="modal-overlay" id="modalLogin">
  <div class="modal">
    <h3>👋 Bem-vindo!</h3>
    <p class="sub">Informe seus dados para participar do leilão.</p>
    <div class="form-group"><label>Seu nome completo</label><input type="text" id="userNome" placeholder="Ex: João Silva"></div>
    <div class="form-group"><label>Seu email</label><input type="email" id="userEmail" placeholder="joao@email.com"></div>
    <button class="btn btn-primary" onclick="entrarLeilao()">🚀 Entrar no Leilão</button>
  </div>
</div>

<!-- Modal PIX -->
<div class="modal-overlay" id="modalPix">
  <div class="modal">
    <button class="close-btn" onclick="closePix()">✕</button>
    <h3>💳 Confirmar Lance</h3>
    <p class="sub">Você está dando um lance de <strong id="pixValor" style="color:#dc2626">R$ 0,00</strong></p>
    <div class="pix-box">
      <div class="qr">📱 QR Code PIX</div>
      <p style="font-size:12px;color:#166534;margin-bottom:8px">Escaneie ou copie o código:</p>
      <code id="pixCode">00020126580014br.gov.bcb.pix0136...</code>
    </div>
    <button class="btn btn-success" onclick="confirmarPagamento()">✅ Já paguei — Confirmar Lance</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API='';
const socket=io();
let campanha=null,usuario=null,lances=[],timerInterval=null,showFullRanking=false;
const slug=window.location.pathname.replace(/^\//,'').split('?')[0]||'';

async function init(){
  if(!slug){showContent('<div class="empty-state"><p>😕 Nenhuma campanha encontrada.</p></div>');return}
  try{
    const res=await fetch(`${API}/api/campanha/${slug}`);
    if(!res.ok)throw new Error('Campanha não encontrada');
    campanha=await res.json();
    document.title=(campanha.premio_nome||campanha.nome)+' | Leilão Fácil';
    renderCampanha();loadLances();checkUser();
  }catch(err){showContent('<div class="empty-state"><p>😕 '+err.message+'</p></div>')}
}

function showContent(html){document.getElementById('content').innerHTML=html}

function renderCampanha(){
  const c=campanha;
  const ativa=c.status==='ativa';
  const encerrada=c.status==='finalizada'||(c.data_fim&&new Date(c.data_fim)<new Date());
  const pausada=c.status==='pausada';

  const imgHtml=c.premio_imagem?`<div class="prize-img-wrap"><img src="${c.premio_imagem}" class="prize-img" alt="${c.premio_nome||c.nome}" onerror="this.style.display='none'"><button class="zoom-btn" onclick="window.open('${c.premio_imagem}','_blank')">🔍 Clique para ampliar</button></div>`:'';

  const meta=parseFloat(c.meta_valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
  const vlance=parseFloat(c.valor_lance||0.01);
  const vlanceStr=vlance.toLocaleString('pt-BR',{minimumFractionDigits:2});
  const proxLance=(vlance*2).toLocaleString('pt-BR',{minimumFractionDigits:2});

  let btnHtml='';
  if(encerrada)btnHtml='<button class="btn-lance" disabled>🏁 Leilão Encerrado</button>';
  else if(pausada)btnHtml='<button class="btn-lance" disabled>⏸️ Leilão Pausado</button>';
  else if(!ativa)btnHtml='<button class="btn-lance" disabled>⏳ Leilão não iniciado</button>';
  else btnHtml=`<button class="btn-lance" onclick="abrirPix()">🚀 Dar lance (R$ ${vlanceStr})</button>`;

  let timerHtml='';
  if(ativa&&!encerrada){
    timerHtml=`<div class="timer-box"><div class="label">⏱️ TEMPO RESTANTE</div><div class="time" id="timer">00:00:00</div><div class="lance-atual">💰 Lance atual: <span>R$ ${vlanceStr}</span></div></div>`;
  }else if(encerrada){
    timerHtml=`<div class="timer-box" style="background:linear-gradient(135deg,#64748b,#475569)"><div class="label">🏁 LEILÃO ENCERRADO</div><div class="time" style="font-size:20px">Obrigado por participar!</div></div>`;
  }

  const nomeExibicao=c.premio_nome||c.nome;
  const descExibicao=c.premio_descricao||c.descricao||'';

  let html=`
    <div class="card">
      <div class="card-title">${nomeExibicao}</div>
      <div class="card-subtitle">${descExibicao}</div>
      <div class="prize-badge">🎯 PRÊMIO DO LEILÃO</div>
      ${imgHtml}
      <div class="meta-text">Meta: <strong>R$ ${meta}</strong></div>
      <div id="winnerBox"></div>
      ${timerHtml}
      <div class="participants">📊 <strong id="partCount">0</strong> participantes</div>
      <div class="proximo-lance">
        <div class="label">💎 Próximo lance</div>
        <div class="valor">R$ ${proxLance}</div>
      </div>
      ${btnHtml}
      <div class="info-text">ℹ️ Cada lance aumenta R$ ${vlanceStr}</div>
    </div>

    <div class="card">
      <div class="section-title">📊 Últimos Lances</div>
      <div id="ultimosLances"><div class="empty-state"><p>Nenhum lance ainda.</p></div></div>
      <button class="btn-ranking" onclick="toggleRanking()">🏆 Ver Ranking Completo (Top 10)</button>
    </div>

    <div class="card" id="rankingCard" style="display:none">
      <div class="section-title">🏆 Ranking (Top 10)</div>
      <div class="ranking-tabs">
        <button class="rank-tab active" onclick="setRankTab(this,'maior')">Maior Lance</button>
        <button class="rank-tab" onclick="setRankTab(this,'mais')">Mais Lances</button>
        <button class="rank-tab" onclick="setRankTab(this,'menos')">Menos Lances</button>
      </div>
      <div id="rankingList"></div>
    </div>
  `;

  showContent(html);
  document.getElementById('topbar').style.display='flex';
  document.getElementById('footer').style.display='block';

  if(ativa&&c.data_fim)startTimer(new Date(c.data_fim));
}

function startTimer(endDate){
  if(timerInterval)clearInterval(timerInterval);
  function update(){
    const diff=endDate-Date.now();
    const el=document.getElementById('timer');
    if(!el){clearInterval(timerInterval);return}
    if(diff<=0){el.textContent='00:00:00';clearInterval(timerInterval);setTimeout(()=>location.reload(),2000);return}
    const h=String(Math.floor(diff/3600000)).padStart(2,'0');
    const m=String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    const s=String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    el.textContent=`${h}:${m}:${s}`;
  }
  update();timerInterval=setInterval(update,1000);
}

async function loadLances(){
  if(!campanha)return;
  try{
    const res=await fetch(`${API}/api/lances/${campanha.id}`);
    lances=await res.json();
    renderLances();renderRanking();renderWinner();
  }catch(e){}
}

function renderWinner(){
  const el=document.getElementById('winnerBox');
  if(!el||!lances.length)return;
  const top=lances[0];
  const data=new Date(top.created_at).toLocaleString('pt-BR');
  el.innerHTML=`<div class="winner-box"><div class="trophy">🏆</div><div class="label">VENCEDOR ATUAL</div><div class="name">${top.nome_usuario||top.nome||'Anônimo'}</div><div class="value">R$ ${parseFloat(top.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><div class="date">⏱️ ${data}</div></div>`;
}

function renderLances(){
  const el=document.getElementById('ultimosLances');
  if(!el)return;
  if(!lances.length){el.innerHTML='<div class="empty-state"><p>Nenhum lance ainda.</p></div>';return}
  let html='';
  lances.slice(0,5).forEach(l=>{
    const data=new Date(l.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const inicial=(l.nome_usuario||l.nome||'A').charAt(0).toUpperCase();
    html+=`<div class="lance-item"><div class="lance-user"><div class="lance-avatar">${inicial}</div><div><div class="lance-name">${l.nome_usuario||l.nome||'Anônimo'}</div><div class="lance-time">${data}</div></div></div><div class="lance-valor">R$ ${parseFloat(l.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>`;
  });
  el.innerHTML=html;
  document.getElementById('partCount').textContent=lances.length;
}

function renderRanking(){
  const el=document.getElementById('rankingList');
  if(!el)return;
  if(!lances.length){el.innerHTML='<div class="empty-state"><p>Nenhum lance ainda.</p></div>';return}
  let html='';
  lances.slice(0,10).forEach((l,i)=>{
    const cls=i===0?'gold':i===1?'silver':i===2?'bronze':'';
    const posCls=i===0?'gold':i===1?'silver':i===2?'bronze':'';
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}º`;
    html+=`<div class="rank-item ${cls}"><div class="rank-pos ${posCls}">${medal}</div><div class="rank-info"><div class="rank-name">${l.nome_usuario||l.nome||'Anônimo'}</div><div class="rank-detail">1 lances • R$ ${parseFloat(l.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})} investido</div></div><div class="rank-valor">R$ ${parseFloat(l.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>`;
  });
  el.innerHTML=html;
}

function toggleRanking(){
  const el=document.getElementById('rankingCard');
  showFullRanking=!showFullRanking;
  el.style.display=showFullRanking?'block':'none';
  if(showFullRanking)el.scrollIntoView({behavior:'smooth'});
}

function setRankTab(btn,tipo){
  document.querySelectorAll('.rank-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  // Por enquanto todos mostram maior lance. Pode expandir depois.
  renderRanking();
}

function checkUser(){
  const u=localStorage.getItem('lf_user');
  if(u){
    usuario=JSON.parse(u);
    document.getElementById('headerUserName').textContent=usuario.nome||usuario.email;
    return;
  }
  if(campanha&&campanha.status==='ativa')setTimeout(()=>document.getElementById('modalLogin').classList.add('active'),800);
}

async function entrarLeilao(){
  const nome=document.getElementById('userNome').value.trim();
  const email=document.getElementById('userEmail').value.trim();
  if(!nome||!email){showToast('Preencha nome e email','error');return}
  try{
    const res=await fetch(`${API}/api/usuarios`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,email})});
    usuario=await res.json();localStorage.setItem('lf_user',JSON.stringify(usuario));
    document.getElementById('modalLogin').classList.remove('active');
    document.getElementById('headerUserName').textContent=usuario.nome||usuario.email;
    showToast('🎉 Bem-vindo, '+nome+'!');
  }catch(e){showToast('Erro ao entrar','error')}
}

function sairLeilao(){
  localStorage.removeItem('lf_user');usuario=null;
  document.getElementById('headerUserName').textContent='';
  if(campanha&&campanha.status==='ativa')document.getElementById('modalLogin').classList.add('active');
}

function abrirPix(){
  if(!usuario){document.getElementById('modalLogin').classList.add('active');return}
  const valor=parseFloat(campanha.valor_lance||0.01).toLocaleString('pt-BR',{minimumFractionDigits:2});
  document.getElementById('pixValor').textContent='R$ '+valor;
  document.getElementById('modalPix').classList.add('active');
}
function closePix(){document.getElementById('modalPix').classList.remove('active')}

async function confirmarPagamento(){
  if(!usuario||!campanha)return;
  try{
    const res=await fetch(`${API}/api/lances`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({campanha_id:campanha.id,usuario_id:usuario.id,valor:campanha.valor_lance})});
    if(res.status===401){
      localStorage.removeItem('lf_user');usuario=null;
      closePix();showToast('Sessão expirada. Faça login novamente.','error');
      setTimeout(()=>document.getElementById('modalLogin').classList.add('active'),500);
      return;
    }
    if(!res.ok)throw new Error('Erro ao registrar lance');
    closePix();showToast('✅ Lance confirmado com sucesso!');loadLances();
  }catch(e){showToast(e.message,'error')}
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');t.textContent=msg;
  t.style.background=type==='error'?'#dc2626':'#1e293b';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);
}

socket.on('novo_lance',(data)=>{if(campanha&&data.campanha_id==campanha.id)loadLances()});
init();
</script>
</body>
</html>
